<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Brandora</title>
<meta name="description" content="Sign in to Brandora to continue building your brand.">
<meta name="theme-color" content="#050507">
<meta name="robots" content="noindex">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="assets/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/brandora.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand-lockup" href="index.html">
      <img src="assets/img/logo-b-solid.svg" alt="" width="20" height="26">
      <span class="brand-lockup__word">BRANDORA</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <a href="create.html" data-i18n="nav.create">Create my brand</a>
      <a href="catalog.html" data-i18n="nav.catalog">Catalogue</a>
      <a href="package.html" data-i18n="nav.package">My package</a>
      <a href="dashboard.html" data-when-signed-in hidden data-i18n="nav.dashboard">Dashboard</a>
      <a href="admin.html" data-when-admin hidden data-i18n="nav.admin">Admin</a>
    </nav>

    <div class="header-tools">
      <a class="btn btn--small btn--ghost" href="login.html" data-when-signed-out hidden data-i18n="nav.login">Log in</a>
      <button class="control" type="button" data-logout data-when-signed-in hidden data-i18n="nav.logout">Log out</button>
      <label class="visually-hidden" for="locale">Language</label>
      <select class="control" id="locale" data-locale-switch>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select>
      <button class="control" type="button" data-theme-toggle aria-pressed="false">
        <span aria-hidden="true">◐</span>
        <span data-theme-label>Dark</span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <section class="section">
    <div class="wrap auth-panel">
      <p class="eyebrow" data-i18n="auth.eyebrow">Your account</p>
      <h1 data-i18n="auth.login.title">Welcome back</h1>
      <p class="lede" data-i18n="auth.login.lede">Your brands, packages and orders are waiting where you left them.</p>

      <p class="notice" data-error hidden role="alert"></p>

      <form data-login-form novalidate>
        <div class="field">
          <label for="email" data-i18n="auth.email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password" data-i18n="auth.password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary" type="submit" data-submit data-i18n="auth.login.submit">Log in</button>
      </form>

      <p class="auth-alt">
        <span data-i18n="auth.login.alt">New to Brandora?</span>
        <a href="signup.html" data-signup-link data-i18n="auth.signup.title">Create an account</a>
      </p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap site-footer__row">
    <span>Brandora</span>
    <a href="create.html" data-i18n="nav.create">Create my brand</a>
    <a href="catalog.html" data-i18n="nav.catalog">Catalogue</a>
    <a href="package.html" data-i18n="nav.package">My package</a>
    <a href="dashboard.html" data-when-signed-in hidden data-i18n="nav.dashboard">Dashboard</a>
  </div>
</footer>

<script src="assets/js/app.js" defer></script>
<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
