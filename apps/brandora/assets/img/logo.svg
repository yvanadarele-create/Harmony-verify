<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="Brandora">
  <title>Brandora</title>
  <!--
    The primary lockup: symbol plus wordmark.

    `currentColor` throughout, so one file serves the dark-mode, light-mode and
    monochrome versions the brand kit calls for — the page sets the colour, and
    there is no chance of a stale duplicate drifting out of step.
  -->
