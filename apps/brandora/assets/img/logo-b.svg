<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Brandora">
  <title>Brandora</title>
  <!--
    The Brandora B: a high-contrast serif letterform in polished black, lit from
    the upper left by a single purple light.

    Drawn as a filled outline with the two counters knocked out by `evenodd`,
    rather than set as text. A <text> element depends on a font being installed
    wherever the file is opened — a printer, a supplier's proofing tool, a
    partner's slide deck — and a substituted font is a different logo. An
    outline is the same shape everywhere, which is the whole point of a mark.

    The rim light is a stroke on the same path rather than a separate glow
    layer, so the highlight follows the letterform exactly at any size and the
    mark still reads when the gradients are stripped for one-colour printing.
  -->
  <defs>
    <linearGradient id="bra-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232028"/>
      <stop offset="38%" stop-color="#0B0A0F"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <linearGradient id="bra-rim" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#B98BE8"/>
      <stop offset="26%" stop-color="#7650A5"/>
      <stop offset="58%" stop-color="#4B167A"/>
      <stop offset="82%" stop-color="#35105C"/>
      <stop offset="100%" stop-color="#9B6FD4"/>
    </linearGradient>
  </defs>

  <g>
    <path fill="url(#bra-body)" stroke="url(#bra-rim)" stroke-width="3.5" fill-rule="evenodd"
          d="M26 20 H112
             C150 20 172 40 172 71
             C172 93 159 109 136 118
             C165 125 182 147 182 177
             C182 214 154 240 110 240
             H26
             V226
             H50
             V34
             H26
             Z
             M84 34 V112 H104
             C126 112 138 98 138 73
             C138 48 126 34 104 34
             Z
             M84 130 V226 H106
             C134 226 148 209 148 178
             C148 147 134 130 106 130
             Z"/>
  </g>
</svg>
