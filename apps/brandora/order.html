<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order — Brandora</title>
<meta name="description" content="Your Brandora order.">
<meta name="theme-color" content="#050507">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="assets/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/brandora.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand-lockup" href="index.html">
      <img src="assets/img/logo-b-solid.svg" alt="" width="20" height="26">
      <span class="brand-lockup__word">BRANDORA</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <a href="create.html" data-i18n="nav.create">Create my brand</a>
      <a href="catalog.html" data-i18n="nav.catalog">Catalogue</a>
      <a href="package.html" data-i18n="nav.package">My package</a>
      <a href="dashboard.html" data-when-signed-in hidden data-i18n="nav.dashboard">Dashboard</a>
      <a href="admin.html" data-when-admin hidden data-i18n="nav.admin">Admin</a>
    </nav>

    <div class="header-tools">
      <a class="btn btn--small btn--ghost" href="login.html" data-when-signed-out hidden data-i18n="nav.login">Log in</a>
      <button class="control" type="button" data-logout data-when-signed-in hidden data-i18n="nav.logout">Log out</button>
      <label class="visually-hidden" for="locale">Language</label>
      <select class="control" id="locale" data-locale-switch>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select>
      <button class="control" type="button" data-theme-toggle aria-pressed="false">
        <span aria-hidden="true">◐</span>
        <span data-theme-label>Dark</span>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <section class="section">
    <div class="wrap wrap--narrow">
      <p class="eyebrow" data-i18n="nav.orders">Order</p>
      <h1 data-order-reference>Your order</h1>

      <p class="notice" data-error hidden role="alert"></p>
      <p class="notice notice--accent" data-payment-instruction hidden></p>

      <dl class="book-defs" data-order-summary></dl>

      <h2 style="margin-top:2.5rem">What you ordered</h2>
      <div class="scroll-x">
        <table class="totals" data-order-lines>
          <caption class="visually-hidden">Order lines</caption>
          <thead><tr><th scope="col">Item</th><th scope="col">Qty</th><th scope="col">Total</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <h2 style="margin-top:2.5rem">History</h2>
      <ol class="timeline" data-order-events></ol>

      <div class="hero__actions">
        <a class="btn btn--primary" data-pay-link hidden href="#">Continue to payment</a>
        <button class="btn btn--ghost" type="button" data-refresh hidden>I have paid — check again</button>
        <a class="btn btn--quiet" href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap site-footer__row">
    <span>Brandora</span>
    <a href="create.html" data-i18n="nav.create">Create my brand</a>
    <a href="catalog.html" data-i18n="nav.catalog">Catalogue</a>
    <a href="package.html" data-i18n="nav.package">My package</a>
    <a href="dashboard.html" data-when-signed-in hidden data-i18n="nav.dashboard">Dashboard</a>
  </div>
</footer>

<script src="assets/js/app.js" defer></script>
<script type="module" src="assets/js/order.js"></script>
</body>
</html>
