<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration — Les Délices de Grace Lumière</title>
  <meta name="description" content="Espace d'administration : commandes, demandes sur mesure, clients, produits, stock et paramètres.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <script src="/assets/js/admin.js" defer></script>
</head>
<body class="admin">
  <!-- Sign-in -->
  <div id="login" class="is-hidden">
    <form class="login-card form" data-login-form novalidate>
      <h1 style="font-size:1.4rem">Administration</h1>
      <p class="muted">Les Délices de Grace Lumière</p>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p class="is-hidden" data-login-status role="status" aria-live="polite"></p>
      <button class="btn btn--primary btn--block" type="submit">Se connecter</button>
      <p class="field__hint" style="margin-top:1rem">
        <a href="/">← Retour au site</a>
      </p>
    </form>
  </div>

  <!-- Console -->
  <div id="console" class="admin-shell is-hidden">
    <aside class="admin-side">
      <div class="admin-side__brand">Les Délices<br>de Grace Lumière</div>
      <nav class="admin-nav" aria-label="Sections">
        <a href="#/">Tableau de bord</a>
        <a href="#/commandes">Commandes <span class="pill is-hidden" data-badge="orders">0</span></a>
        <a href="#/calendrier">Calendrier</a>
        <a href="#/clients">Clients</a>
        <a href="#/produits">Produits</a>
        <a href="#/categories">Catégories</a>
        <a href="#/options">Options &amp; choix</a>
        <a href="#/medias">Photos</a>
        <a href="#/temoignages">Témoignages</a>
        <a href="#/stock">Stock <span class="pill is-hidden" data-badge="stock">0</span></a>
        <a href="#/fournisseurs">Fournisseurs</a>
        <a href="#/rendez-vous">Rendez-vous <span class="pill is-hidden" data-badge="appointments">0</span></a>
        <a href="#/notifications">Notifications <span class="pill is-hidden" data-badge="notifications">0</span></a>
        <a href="#/parametres">Paramètres</a>
      </nav>
      <div style="margin-top:auto; display:grid; gap:0.5rem">
        <a class="btn btn--ghost btn--sm" href="/" target="_blank" rel="noopener">Voir le site</a>
        <button class="btn btn--quiet btn--sm" type="button" data-logout>Se déconnecter</button>
        <p class="field__hint" data-user></p>
      </div>
    </aside>

    <main class="admin-main" id="view" tabindex="-1"></main>
  </div>

  <dialog class="modal" data-modal>
    <form method="dialog" data-modal-form>
      <div class="modal__head">
        <h2 data-modal-title>Modifier</h2>
        <button class="btn btn--quiet btn--sm" type="button" data-modal-close aria-label="Fermer">✕</button>
      </div>
      <div class="modal__body" data-modal-body></div>
      <div class="modal__foot">
        <button class="btn btn--quiet" type="button" data-modal-close>Annuler</button>
        <button class="btn btn--primary" type="submit" data-modal-submit>Enregistrer</button>
      </div>
    </form>
  </dialog>
</body>
</html>
